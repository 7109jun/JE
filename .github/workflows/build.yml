```yaml
name: Build JE 1.0 Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure

      - name: Check JE executable
        shell: bash
        run: |
          test -f build/je.exe

      - name: Package source
        shell: pwsh
        run: |
          if (Test-Path "JE-1.0-final.zip") {
            Remove-Item "JE-1.0-final.zip" -Force
          }

          $exclude = @(
            ".git",
            "build",
            "build-*",
            "target"
          )

          $items = Get-ChildItem -Force | Where-Object {
            $exclude -notcontains $_.Name
          }

          Compress-Archive `
            -Path $items.FullName `
            -DestinationPath "JE-1.0-final.zip" `
            -Force

      - name: Upload JE-1.0-final.zip
        uses: actions/upload-artifact@v4
        with:
          name: JE-1.0-final
          path: JE-1.0-final.zip
          if-no-files-found: error

      - name: Upload je.exe
        uses: actions/upload-artifact@v4
        with:
          name: je-windows-x64
          path: build/je.exe
          if-no-files-found: error
```
