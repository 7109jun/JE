name: Build JE 1.0 Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure

      - name: Check executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build/je.exe")) {
            Write-Error "build/je.exe was not created."
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          if (Test-Path "JE-1.0-final.zip") {
            Remove-Item "JE-1.0-final.zip" -Force
          }

          $items = Get-ChildItem -Force | Where-Object {
            $_.Name -ne ".git" -and
            $_.Name -ne "build" -and
            $_.Name -ne "target"
          }

          Compress-Archive `
            -Path $items.FullName `
            -DestinationPath "JE-1.0-final.zip" `
            -Force

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: JE-1.0-final
          path: JE-1.0-final.zip
          if-no-files-found: error

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: je-windows-x64
          path: build/je.exe
          if-no-files-found: error
