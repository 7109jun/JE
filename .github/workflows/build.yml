name: TE_SourceCode

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 (MinGW-w64)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: JE-1.1-MinGW-fixed

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MinGW-w64
        shell: pwsh
        run: |
          choco install mingw -y --no-progress

          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"

          if (-not (Test-Path $mingwBin)) {
            $mingwBin = "C:\mingw64\bin"
          }

          if (-not (Test-Path $mingwBin)) {
            Write-Error "MinGW-w64 bin directory was not found."
            exit 1
          }

          $env:PATH = "$mingwBin;$env:PATH"
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Check MinGW
        shell: pwsh
        run: |
          gcc --version
          mingw32-make --version
          cmake --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . `
            -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          ctest `
            --test-dir build `
            --output-on-failure `
            -C Release

      - name: Check executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build/je.exe")) {
            Write-Error "build/je.exe was not created."
            exit 1
          }

          Get-Item "build/je.exe" | Format-List Name,Length,FullName

      - name: Test JE runtime examples
        shell: pwsh
        run: |
          .\build\je.exe run examples\runtime_memory.jxj
          .\build\je.exe run examples\runtime_file_io.jxj

      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            "build\je.exe" `
            "dist\je.exe" `
            -Force

          Copy-Item `
            "examples" `
            "dist\examples" `
            -Recurse `
            -Force

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: JE-1.1-MinGW-fixed-Windows-x64
          path: JE-1.1-MinGW-fixed/dist
          if-no-files-found: error
